name: Release native and Python editions
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-dejavu-core
      - name: Verify the release tag matches the package version
        run: python -c "import os, tomllib; from pathlib import Path; version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']; assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and package version differ'"
      - name: Install and test independent application
        run: |
          python -m pip install . build
          python -m unittest discover -s tests -v
      - name: Build verified release packages
        run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: athenaeum-python
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install native application and build tools
        run: python -m pip install ".[semantic]" PyInstaller==6.22.3
      - name: Verify native application tests
        run: python -m unittest discover -s tests -v
      - name: Prepare verified search weights for executable acceptance
        run: python -c "import asyncio, os; from pathlib import Path; from aletheia_core.assets import prepare_embeddings; asyncio.run(prepare_embeddings(Path(os.environ['RUNNER_TEMP']) / 'athenaeum-verification-assets'))"
      - name: Build standalone Windows executable
        run: python packaging/build_windows.py
      - name: Test actual executable without a Python environment
        shell: pwsh
        run: |
          $version = python -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])"
          python packaging/verify_windows.py --exe "dist/Aletheia-Athenaeum-$version-windows-x64.exe" --embeddings "$env:RUNNER_TEMP/athenaeum-verification-assets/embedding"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: athenaeum-windows
          path: |
            dist/*-windows-x64.exe
            dist/*-windows-x64-licenses.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [python, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: athenaeum-*
          path: release-assets
          merge-multiple: true
      - name: Upload, verify and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/publish_release.py
