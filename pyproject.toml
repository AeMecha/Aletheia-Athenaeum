[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia-athenaeum"
version = "0.1.2"
description = "Aletheia Athenaeum: a native PySide6 personal knowledge library."
requires-python = ">=3.12"
license = "LicenseRef-Aletheia-Distribution"
license-files = ["LICENSE", "NOTICE", "LICENSING.md", "ATTRIBUTION.md", "LICENSES/*.txt"]
readme = "README.md"
dependencies = ["PySide6-Essentials>=6.8,<7", "httpx==0.28.1", "filelock==3.29.4"]

[project.optional-dependencies]
semantic = ["numpy>=2,<3", "onnxruntime>=1.20,<2", "tokenizers>=0.22,<1"]

[project.scripts]
aletheia-athenaeum = "aletheia_athenaeum.__main__:main"

[project.urls]
Repository = "https://github.com/AeMecha/Aletheia-Athenaeum"
Upstream = "https://github.com/AdeptTel1/Aletheia"
"Implementation lineage" = "https://github.com/AeMecha/Aletheia-Scriptorium"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aletheia_core = ["data/*.json", "data/prompts/*.md", "data/prompts/*.txt"]
